<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My retro page</title>
    <link rel="stylesheet" href="my_2000s_space.css">
</head>
<body>

    <!-- The "Desktop" background -->
    <main class="desktop">
        
        <!-- The "Window" -->
        <div class="window">
            <!-- Title Bar -->
            <div class="title-bar">
				<!-- Buttons come first for left-side alignment -->
				<div class="title-controls">
					<button>_</button>
					<button>□</button>
					<button class="close">X</button>
				</div>
				<div class="title-text">Feel free to explore!</div>
			</div>

            <!-- Content Area -->
            <div class="window-body">
                <nav class="sidebar">
                    <a href="#">Home</a>
                    <a href="#">Gallery</a>
                    <a href="#">Music</a>
                    <a href="#">About</a>
                    <div class="status-box">
                        <p>Status: Online</p>
                    </div>
                </nav>

                <section class="main-content">
                    <h1>Welcome to my page!</h1>
                    <p>This site is under construction.</p>
                    <hr>
                    <div class="blink">*** NEW UPDATES Eventually! ***</div>
                    <p>I'm building this site to kill boredom.</p>
                    <img src="https://via.placeholder.com/150" alt="Construction GIF" class="pixel-art">
                </section>
            </div>
            
            <!-- Footer bar -->
            <div class="window-footer">
                <span>Items: 4</span>
                <span>My Computer</span>
            </div>
        </div>

    </main>

</body>
</html>
